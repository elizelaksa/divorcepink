<script>const euro = n => n === null || n === undefined ? '—' : typeof n === 'number' ? new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n) : esc(n);
const esc = s => String(s ?? '').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const label = s => s.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());
const impact = e => `<div class="impact">${['profit','cash','assets','liabilities','equity'].map(k=>`<span><b>${label(k)}</b><br>${euro(e[k])}</span>`).join('')}</div>`;
const confidence = c => `<span class="pill ${c}">${esc(c)}</span>`;
const moneyRows = obj => Object.entries(obj).map(([k,v])=>`<tr><td>${esc(label(k))}</td><td class="num">${euro(v)}</td></tr>`).join('');
const table = (title,obj) => `<section class="card"><h3>${esc(title)}</h3><div class="table-wrap"><table><tbody>${moneyRows(obj)}</tbody></table></div></section>`;

function header(review=false){const local=location.protocol==='file:',home=local?(review?'../index.html':'index.html'):'/',assessor=local?(review?'index.html':'review/index.html'):'/review',submission=local?(review?'../submission.json':'submission.json'):'/submission.json';return `<header class="top"><div class="top-inner"><a class="brand" href="${home}">DPI <span>·</span> HT-01</a><nav class="nav" aria-label="Primary"><a href="${home}" ${!review?'aria-current="page"':''}>Case review</a><a href="${assessor}" ${review?'aria-current="page"':''}>Assessor view</a><a href="${submission}">Submission JSON</a></nav></div></header>`}
function metrics(d){const b=d.statements.balanceSheet,p=d.statements.profitAndLoss,c=d.statements.cashFlow;return `<div class="metrics"><div class="metric good"><small>Reconstructed profit</small><strong>${euro(p.reconstructedProfit)}</strong></div><div class="metric good"><small>Closing cash</small><strong>${euro(c.closingCash)}</strong></div><div class="metric"><small>Total assets</small><strong>${euro(b.totalAssets)}</strong></div><div class="metric"><small>Total liabilities</small><strong>${euro(b.totalLiabilities)}</strong></div><div class="metric"><small>Implied net assets / equity</small><strong>${euro(b.impliedNetAssetsEquity)}</strong></div><div class="metric warn"><small>Count-basis inventory</small><strong>${euro(b.inventorySelectedCountBasis)}</strong></div></div>`}
function decision(d,trail=false){return `<article class="decision"><div class="decision-top"><div><div class="meta"><b>${d.id}</b> · <span class="pill ${d.reviewTier}">${d.reviewTier==='material_judgment'?'material judgment':'operational'}</span></div><h3>${esc(d.question)}</h3></div>${confidence(d.confidence)}</div><p><b>Certified answer:</b> ${esc(d.answer)}</p><div class="meta"><b>Evidence:</b></div><ul class="evidence-list">${d.evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${trail?`<dl class="trail"><dt>AI proposal</dt><dd>${esc(d.aiProposal)}</dd><dt>Independent AI position</dt><dd>${esc(d.independentChallenge)}</dd><dt>Student certification${d.changedFromAI?' · override of AI proposal':''}</dt><dd>${esc(d.studentReasoning)}</dd><dt>Statement effect</dt><dd>${impact(d.statementEffect)}</dd></dl>`:''}</article>`}
function overview(d){const p=d.statements.profitAndLoss,b=d.statements.balanceSheet,c=d.statements.cashFlow;return `<div class="shell"><div class="hero"><div><p class="eyebrow">Reconstructed accounts · 31 August 2026</p><h1>Divorce Party International Ltd.</h1><p>Evidence-led reconstruction for board review. Bank records, signed contracts, legal evidence and warehouse evidence outrank management reporting.</p></div><span class="stamp">Case ${d.caseId}</span></div>${metrics(d)}<div class="tabs" role="tablist"><button class="active" data-view="overview">Executive overview</button><button data-view="statements">Statements</button><button data-view="schedules">Schedules</button><button data-view="evidence">Evidence</button><button data-view="decisions">100 decisions</button><button data-view="trail">AI review trail</button></div><div id="views"><section data-panel="overview"><div class="grid two"><div class="notice danger"><strong>Do not rely on management profit of EUR 312,000.</strong>Reconstructed profit is EUR 65,000. The EUR 50,000 borrowing is a liability, September deposits are not August revenue, and EUR 110,000 owner spending is distribution—not payroll or marketing.</div><div class="notice"><strong>Inventory reconciliation remains open.</strong>The selected direct count basis is EUR 121,000. A EUR 9,000 difference against the inventory flow remains visibly unresolved; no balancing entry is created.</div></div><section class="section"><h2>Board recommendation</h2><div class="card"><p><b>${esc(d.boardRecommendation.recommendation)}</b></p><ul>${d.boardRecommendation.immediateActions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></section><section class="section"><h2>Required financial checks</h2><div class="table-wrap"><table><thead><tr><th>Reconciliation</th><th>Calculation</th><th>Status</th></tr></thead><tbody>${d.reconciliations.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${esc(r.calculation)}</td><td class="${r.status.startsWith('pass')?'rec-pass':'rec-open'}">${esc(r.status)}</td></tr>`).join('')}</tbody></table></div></section><section class="section"><h2>Material uncertainties</h2><div class="grid two">${d.uncertainties.map(u=>`<div class="card"><h3>${u.id} · ${esc(u.issue)}</h3><p><b>Reported:</b> ${esc(u.reportedTreatment)}</p><p><b>Alternative:</b> ${esc(u.alternative)}</p><p class="meta">Potential statement effect: ${euro(u.effect)}</p></div>`).join('')}</div></section></section><section class="hide" data-panel="statements">${statements(p,c,b)}</section><section class="hide" data-panel="schedules">${schedules(d.schedules)}</section><section class="hide" data-panel="evidence">${evidence(d.evidence)}</section><section class="hide" data-panel="decisions">${decisionList(d.decisions)}</section><section class="hide" data-panel="trail">${trail(d.decisions)}</section></div><p class="footer">Prepared for student certification by Elize Ineta Laksa · el25109.</p></div>`}
function statements(p,c,b){return `<section class="section"><h2>Corrected financial statements</h2><div class="grid three">${table('Profit and loss statement',p)}${table('Cash flow statement',c)}${table('Balance sheet',b)}</div></section>`}
function schedules(s){return `<section class="section"><h2>Supporting schedules</h2><div class="grid two">${table('Revenue and receivables',s.revenueAndReceivables)}${table('Inventory and COGS',s.inventoryAndCogs)}${table('Payroll',s.payroll)}${table('Operating expenses',s.operatingExpenses)}${table('PPE and depreciation',s.ppe)}${table('Debt and interest',s.debtAndInterest)}${table('Equity and distributions',s.equityAndDistributions)}</div><div class="notice"><strong>Insurance is not estimated.</strong>The supplied data contains no insurance movement. It remains a low-confidence missing-evidence item.</div></section>`}
function evidence(list){return `<section class="section"><h2>Evidence register</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Evidence</th><th>Reliability</th><th>Use</th></tr></thead><tbody>${list.map(e=>`<tr><td><b>${e.id}</b></td><td>${esc(e.name)}</td><td>${confidence(e.reliability)}</td><td>${esc(e.use)}</td></tr>`).join('')}</tbody></table></div></section>`}
function decisionList(ds){return `<section class="section"><div class="review-head"><div><h2>Decision register · 100 of 100</h2><p class="meta">75 operational decisions and 25 material management-accounting judgments.</p></div><div class="filters" id="decision-filter"><button class="active" data-filter="all">All</button><button data-filter="material_judgment">Material 25</button><button data-filter="medium">Medium/low</button></div></div><div id="decision-results">${ds.map(x=>decision(x)).join('')}</div></section>`}
function trail(ds){return `<section class="section"><h2>AI review trail · 25 material judgments</h2><p class="meta">For each material judgment: original AI proposal, independent position, student-certified answer, evidence, financial impact and confidence.</p>${ds.filter(x=>x.reviewTier==='material_judgment').map(x=>decision(x,true)).join('')}</section>`}
function review(d){const focus=d.decisions.filter(x=>x.confidence!=='high'); const disagreements=d.decisions.filter(x=>x.reviewTier==='material_judgment' && x.changedFromAI);return `<div class="shell"><div class="hero"><div><p class="eyebrow">Compact assessor view</p><h1>Focused judgment review</h1><p>Review confidence, alternative treatments and certification trail before accepting the reconstructed accounts.</p></div><span class="stamp">${focus.length} decisions need attention</span></div>${metrics(d)}<section class="section"><div class="grid two"><div class="notice danger"><strong>Web-revenue alternative</strong>If EUR 360,000 web revenue is not recognised, reconstructed profit becomes a <b>EUR 295,000 loss</b>. CRM delivery supports recognition, but individual customer acceptances are absent.</div><div class="notice"><strong>Inventory difference</strong>Selected direct count basis is EUR 121,000. A EUR 9,000 difference against the inventory flow remains unresolved; no balancing entry has been created.</div><div class="notice"><strong>Legal provision range</strong>EUR 25,000 is the reported best estimate within an external-evidence range of EUR 20,000–30,000. Profit and equity could vary by EUR 5,000.</div><div class="notice danger"><strong>Student override / disagreement status</strong>${disagreements.length?`${disagreements.length} certified override(s) are recorded below.`:'No student override of an AI proposal is recorded in the prepared register.'}</div></div></section><section class="section"><h2>Unresolved uncertainty</h2><div class="grid two">${d.uncertainties.map(u=>`<div class="card"><h3>${u.id}</h3><p>${esc(u.issue)}</p><p class="meta">${esc(u.alternative)}</p></div>`).join('')}</div></section><section class="section"><h2>Medium- and low-confidence decisions</h2>${focus.map(x=>decision(x,x.reviewTier==='material_judgment')).join('')}</section><section class="section"><h2>Material judgment disagreements and certification</h2>${d.decisions.filter(x=>x.reviewTier==='material_judgment').map(x=>decision(x,true)).join('')}</section></div>`}
function boot(){try{const d=window.CASE_DATA;if(!d)throw Error('embedded case data is unavailable');const root=document.querySelector('#app'),isReview=location.pathname.startsWith('/review');root.innerHTML=header(isReview)+(isReview?review(d):overview(d));if(!isReview){document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b===btn));document.querySelectorAll('[data-panel]').forEach(p=>p.classList.toggle('hide',p.dataset.panel!==btn.dataset.view))}));document.querySelector('#decision-filter')?.addEventListener('click',e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('#decision-filter button').forEach(b=>b.classList.toggle('active',b===e.target));const f=e.target.dataset.filter;document.querySelector('#decision-results').innerHTML=d.decisions.filter(x=>f==='all'||x.reviewTier===f||(f==='medium'&&x.confidence!=='high')).map(x=>decision(x)).join('')})}}catch(e){document.querySelector('#app').innerHTML=`<p class="loading">Unable to open the embedded case data: ${esc(e.message)}</p>`}}boot();
</script>
</body>
</html>
